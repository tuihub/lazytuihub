[settings]
idiomatic_version_file_enable_tools = ["dotnet", "node", "pnpm"]

[tools]
go = "1.27.3"
protoc = "36.2"
"go:github.com/googleapis/api-linter/v2/cmd/api-linter" = "2.4.1"
"go:github.com/google/gnostic/cmd/protoc-gen-openapi" = "0.7.0"

[vars]
aip_repository = "https://github.com/aip-dev/google.aip.dev.git"
aip_revision = "2ccc61a4e09882bdd63aea1a42dceebc37bf3bd5"

[doctor.checks.dotnet]
description = ".NET SDK {{ read_json(path='global.json')['sdk']['version'] }} is available"
run = "dotnet --version"
hint = "Run `mise install dotnet` to install the SDK declared in global.json."

[doctor.checks.node]
description = "Node.js {{ read_json(path='package.json')['devEngines']['runtime']['version'] }} is available"
run = '''node -e "process.exit(process.versions.node === '{{ read_json(path="package.json")["devEngines"]["runtime"]["version"] }}' ? 0 : 1)"'''
hint = "Run `mise install node` to install the Node.js version declared in package.json."

[doctor.checks.pnpm]
description = "pnpm is available"
depends = "node"
run = "mise which pnpm --version && pnpm --version"
hint = "Run `mise install pnpm` to install the package manager declared in package.json."

[doctor.checks.csharpier]
description = "The repository-local CSharpier tool is available"
depends = "dotnet"
run = "dotnet csharpier --version"
hint = "Run `mise exec -- dotnet tool restore`."

[doctor.checks.jscpd]
description = "The product duplication checker is available"
depends = "pnpm"
run = "pnpm exec jscpd --version"
hint = "Run `mise exec -- pnpm install --frozen-lockfile`."

[doctor.checks.api-linter]
description = "Google API Linter is available"
run = "api-linter --version"
hint = "Run `mise install`."

[doctor.checks.protoc]
description = "The Proto compiler is available"
run = "protoc --version"
hint = "Run `mise install`."

[doctor.checks.openapi-generator]
description = "The Proto to OpenAPI generator is available"
run = "mise which protoc-gen-openapi"
hint = "Run `mise install`."

[doctor.checks.nswag]
description = "The repository-local NSwag tool is available"
depends = "dotnet"
run = "dotnet nswag version"
hint = "Run `mise exec -- dotnet tool restore`."

[doctor.checks.aip]
description = "Official AIP references match the project revision"
depends = "node"
run = "node .agents/scripts/setup-aip.mjs {{vars.aip_repository}} {{vars.aip_revision}} --check"
hint = "Run `mise run setup:aip`."

[tasks.build]
description = "Build the application"
run = "dotnet build LazyTuiHub.slnx"

[tasks."check:code"]
description = "Check C# analyzers, formatting, and duplication"
depends = ["check:analyzers", "check:format", "check:duplicates"]

[tasks."check:analyzers"]
description = "Build with analyzer warnings enforced"
depends = ["check:files"]
run = "dotnet build LazyTuiHub.slnx --no-incremental -warnaserror"

[tasks."check:format"]
description = "Check C# formatting"
depends = ["check:files"]
run = "dotnet csharpier check ."

[tasks."check:duplicates"]
description = "Check duplicate product C#"
depends = ["check:files"]
run = "pnpm exec jscpd"

[tasks."check:files"]
description = "Reject repository files larger than 1 MiB"
run = "node .agents/scripts/check-file-sizes.mjs"

[tasks."test:lint"]
description = "Verify lint gates, thresholds, and test isolation"
run = "node --test .agents/tests/csharp-lint.test.mjs .agents/tests/check-file-sizes.test.mjs"

[tasks."check:markdown"]
description = "Check Markdown"
run = "pnpm run lint:markdown"

[tasks."check:notes"]
description = "Check note transitions and frozen content against Git"
run = "node .agents/scripts/check-note-history.mjs"

[tasks."check:commit"]
description = "Check a commit message against Conventional Commits"
run = "node .agents/scripts/commits.mjs check"

[tasks."setup:hooks"]
description = "Enable this repository's Git commit-message hook"
run = "node .agents/scripts/commits.mjs setup"

[tasks.check]
description = "Run all checks"
depends = ["check:code", "check:api", "check:markdown", "check:notes", "check:commit"]

[tasks.run]
description = "Run the application"
run = "dotnet run --project src/LazyTuiHub/LazyTuiHub.csproj --"

[tasks."format:code"]
description = "Format C# code"
run = "dotnet csharpier format ."

[tasks.notes]
description = "List and filter agent notes"
run = "node .agents/scripts/filter-frontmatter.mjs .agents/notes"
output = "interleave"
quiet = true

[tasks."setup:aip"]
description = "Prepare the pinned official AIP reference checkout"
run = "node .agents/scripts/setup-aip.mjs {{vars.aip_repository}} {{vars.aip_revision}}"

[tasks."restore:api"]
description = "Restore Proto contract dependencies"
run = "dotnet restore src/LazyTuiHub.Api/LazyTuiHub.Api.csproj"

[tasks."generate:api"]
description = "Generate OpenAPI, the HTTP client, and Markdown reference from Proto"
depends = ["restore:api"]
run = "node .agents/scripts/api.mjs generate"

[tasks."check:proto"]
description = "Check Proto contracts with Google API Linter"
depends = ["restore:api"]
run = "node .agents/scripts/api.mjs lint"

[tasks."check:generated"]
description = "Check that generated API artifacts match Proto"
depends = ["restore:api"]
run = "node .agents/scripts/api.mjs check"

[tasks."check:api"]
description = "Check API contracts and generated artifacts"
depends = ["check:proto", "check:generated"]

[tasks."demo:api"]
description = "Run Hello World through local and generated HTTP clients"
depends = ["check:api"]
run = "dotnet run --project src/LazyTuiHub -- --demo true"
