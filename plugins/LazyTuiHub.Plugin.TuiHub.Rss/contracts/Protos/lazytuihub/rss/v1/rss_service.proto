syntax = "proto3";

package lazytuihub.rss.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "lazytuihub/rss/v1/feed.proto";

option csharp_namespace = "LazyTuiHub.Api.Rss.V1";
option go_package = "github.com/tuihub/lazytuihub/api/rss/apiv1;rsspb";
option java_multiple_files = true;
option java_outer_classname = "RssServiceProto";
option java_package = "io.github.tuihub.lazytuihub.rss.v1";

// Reads and refreshes subscriptions through the shared node-based pipeline.
// This exploratory server is intended for a trusted local operator. Public
// hosting requires an identity and authorization policy before exposure.
// HTTP errors currently use ASP.NET Core transcoding's google.rpc.Status JSON:
// code is the canonical gRPC number and details includes google.rpc.ErrorInfo.
// The outer error envelope and HTTP-valued code described by AIP-193 are not
// implemented in this prototype; clients must use the HTTP response status.
service RssService {
  // Creates a subscription without making a network request.
  // A duplicate ID or URI returns ALREADY_EXISTS. A repeated request_id with
  // the same inputs returns the original subscription, including after restart.
  // Reusing that ID for different inputs returns INVALID_ARGUMENT.
  //
  // Example HTTP request, with BASE_URL set to the service base URL:
  //
  // ```sh
  // curl -X POST "${BASE_URL}/v1/feeds?requestId=123e4567-e89b-42d3-a456-426614174000" \
  //   -H 'Content-Type: application/json' \
  //   -d '{"uri":"https://example.com/feed.xml","displayName":"Example"}'
  // ```
  rpc CreateFeed(CreateFeedRequest) returns (Feed) {
    option (google.api.http) = { post: "/v1/feeds" body: "feed" };
    option (google.api.method_signature) = "feed,feed_id";
  }

  // Lists subscriptions in stable resource-ID order through the reading pipeline.
  rpc ListFeeds(ListFeedsRequest) returns (ListFeedsResponse) {
    option (google.api.http) = { get: "/v1/feeds" };
    option (google.api.method_signature) = "";
  }

  // Reads a subscription through the shared reading pipeline. Unknown names
  // return NOT_FOUND.
  rpc GetFeed(GetFeedRequest) returns (Feed) {
    option (google.api.http) = { get: "/v1/{name=feeds/*}" };
    option (google.api.method_signature) = "name";
  }

  // Fetches one subscription and streams its entries through parsing and storage.
  // Waits for this finite pipeline execution. Repeated refreshes upsert entries
  // by their source identity and preserve read state; HTTP fetches can repeat.
  // Identity uses the RSS guid or Atom id, then the resolved entry link, and
  // finally a content hash. Without a stable ID or link, content edits can
  // produce a new article identity.
  // Cancellation or a node error can leave already committed entries in place.
  // This method does not promise atomic feed snapshots or exactly-once delivery.
  // An unknown subscription returns NOT_FOUND. Upstream or parsing failure
  // returns UNAVAILABLE; callers can retry a refresh without duplicating entries.
  // A missing node in the configured pipeline returns FAILED_PRECONDITION.
  rpc RefreshFeed(RefreshFeedRequest) returns (RefreshFeedResponse) {
    option (google.api.http) = { post: "/v1/{name=feeds/*}:refresh" body: "*" };
    option (google.api.method_signature) = "name";
  }
}

// Request for CreateFeed.
message CreateFeedRequest {
  // Required. The subscription to create. Its name is ignored.
  Feed feed = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional. A lowercase, hyphenated UUID for the subscription. Omission
  // generates one. An existing ID returns ALREADY_EXISTS.
  string feed_id = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional. A UUID version 4 identifying this creation request. Successful
  // request IDs remain deduplicated for the lifetime of the subscription.
  string request_id = 3 [(google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4];
}

// Request for GetFeed.
message GetFeedRequest {
  // Required. The subscription name, `feeds/{feed}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lazytuihub.tuihub.org/Feed"];
}

// Request for ListFeeds.
message ListFeedsRequest {
  // Optional. Number of subscriptions per page. Zero uses 50; negative values
  // return INVALID_ARGUMENT. This prototype has no additional maximum.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // Optional. An opaque continuation token from a previous response.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response for ListFeeds.
message ListFeedsResponse {
  // The subscriptions in this page.
  repeated Feed feeds = 1;
  // A continuation token, or empty at the end of the collection.
  string next_page_token = 2;
}

// Request for RefreshFeed.
message RefreshFeedRequest {
  // Required. The subscription name, `feeds/{feed}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "lazytuihub.tuihub.org/Feed"];
}

// Response for RefreshFeed.
message RefreshFeedResponse {
  // Number of entries processed, including existing entries that were updated.
  int32 processed_article_count = 1;
}
