syntax = "proto3";

package lazytuihub.articles.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "LazyTuiHub.Api.Articles.V1";
option go_package = "github.com/tuihub/lazytuihub/api/articles/apiv1;articlespb";
option java_multiple_files = true;
option java_outer_classname = "ArticleProto";
option java_package = "io.github.tuihub.lazytuihub.articles.v1";

// An article collected from a source in this workspace.
message Article {
  option (google.api.resource) = {
    type: "lazytuihub.tuihub.org/Article"
    pattern: "articles/{article}"
    singular: "article"
    plural: "articles"
  };

  // Identifier. The article name, `articles/{article}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The source entry title, which can be empty.
  string title = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The resolved entry URI, or empty when none was supplied.
  string uri = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The entry content or summary. It may contain untrusted HTML;
  // a rendering client must sanitize it before displaying it as HTML.
  string content = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The source publication time, omitted when absent or invalid.
  google.protobuf.Timestamp publish_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the user has marked this article as read.
  bool read = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The source resource name supplied by the producer, such as `feeds/{feed}`.
  string source = 7 [(google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "*"];
}
